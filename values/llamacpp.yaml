image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server

llamacpp:
  model: "openbmb/MiniCPM5-1B-GGUF:Q8_0"

resources:
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    cpu: 4
    memory: 8Gi

persistence:
  enabled: true
  size: 10Gi

ingresses:
  - name: llamacpp
    host: llamacpp.home.arpa
    paths:
      - path: /
        service:
          name: llamacpp
          port: 8080
