image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server

llamacpp:
  model:
    repo: "Qwen/Qwen3-0.6B-GGUF"
    file: "Qwen3-0.6B-Q8_0.gguf"

  gpuLayers: 0

resources:
  requests:
    cpu: 2
    memory: 2Gi
  limits:
    cpu: 4
    memory: 4Gi

persistence:
  enabled: true
  size: 10Gi

ingresses:
  - name: llamacpp
    host: llamacpp.home.arpa
    paths:
      - path: /
        service:
          name: llamacpp
          port: 8080
