apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tabbyapi.fullname" . }}-config

data:
  config.yml: |
    network:
      host: 0.0.0.0
      port: 5000
      disable_auth: true

    model:
      model_name: {{ .Values.model.name | quote }}

      {{- toYaml .Values.model.config | nindent 6 }}
