image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server
  pullPolicy: IfNotPresent

llamacpp:
  host: 0.0.0.0
  port: 8080

  model: ""

  # Local directory used by llama.cpp/Hugging Face for the model.
  cacheDir: /models

  # llama.cpp backend-specific GPU offload.
  # 0 = CPU only, -1 = all layers.
  gpuLayers: -1

  parallel: 1

gpu:
  enabled: false
  resource: ""
  count: 1

resources:
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    memory: 8Gi

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

nodeSelector: {}

tolerations: []

affinity: {}
