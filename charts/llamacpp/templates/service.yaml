apiVersion: v1
kind: Service
metadata:
  name: {{ include "llamacpp.fullname" . }}
  labels:
    {{- include "llamacpp.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "llamacpp.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
